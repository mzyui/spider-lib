
name: Cargo Docs

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cargo-docs-pages
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Cargo documentation
        run: cargo doc --workspace --all-features --no-deps

      - name: Copy docs to repository docs folder
        run: |
          rm -rf docs
          mkdir -p docs
          cp -R target/doc/. docs/
          touch docs/.nojekyll
          cat > docs/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=./spider_lib/index.html" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>spider-lib docs</title>
            </head>
            <body>
              <p>Redirecting to <a href="./spider_lib/index.html">spider-lib documentation</a>...</p>
            </body>
          </html>
          EOF

      - name: Commit generated docs
        run: |
          git add -A docs

          if git diff --cached --quiet -- docs; then
            echo "No documentation changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update cargo docs [skip ci]"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: build-docs
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
